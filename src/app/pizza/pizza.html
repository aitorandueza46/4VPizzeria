<div class="card h-100 d-flex flex-column border-0 shadow-sm" style="width: 18rem">
  <img [src]="pizza().imagen" class="card-img-top" [alt]="'Pizza ' + pizza().nombre" />
  <div class="card-body d-flex flex-column">
    <h5 class="card-title fw-bold text-danger">{{ pizza().nombre }} — {{ pizza().precioFormateado }}</h5>
    <p class="card-text">Ingredientes: {{ pizza().ingredientes }}.</p>
    <form
      class="mt-auto"
      (submit)="$event.preventDefault(); solicitarPizza(entradaCantidad.value)"
    >
      <label class="form-label" [for]="'cantidad-' + pizza().nombre">Cantidad</label>
      <input
        class="form-control"
        [id]="'cantidad-' + pizza().nombre"
        type="number"
        min="0"
        step="1"
        value="0"
        #entradaCantidad
      />
      <button class="btn btn-danger w-100 mt-2" type="submit">Añadir al pedido</button>
    </form>
  </div>
</div>
