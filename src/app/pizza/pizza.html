<div class="card h-100 d-flex flex-column" style="width: 18rem">
  <img [src]="pizza().imagen" class="card-img-top" [alt]="'Pizza ' + pizza().nombre" />
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ pizza().nombre }} — {{ pizza().precioFormateado }}</h5>
    <p class="card-text">Ingredientes: {{ pizza().ingredientes }}.</p>
    <a href="#pedido" class="btn btn-primary mt-auto">Pedir ahora</a>
  </div>
</div>
