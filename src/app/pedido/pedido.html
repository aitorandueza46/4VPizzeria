<section class="container my-4" aria-labelledby="pedido-titulo">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-danger text-white">
      <h2 id="pedido-titulo" class="h5 mb-0">Tu pedido</h2>
    </div>
    <div class="card-body">
      @if (lineasPedido().length === 0) {
        <p class="text-body-secondary mb-4">Todavía no has añadido pizzas.</p>
      } @else {
        <ul class="list-group list-group-flush mb-3">
          @for (linea of lineasPedido(); track linea.pizza.nombre) {
            <li class="list-group-item d-flex justify-content-between align-items-center px-0">
              <span>
                {{ linea.pizza.nombre }}
                <span class="text-body-secondary">× {{ linea.cantidad }}</span>
              </span>
              <span>{{ subtotal(linea) }}$</span>
            </li>
          }
        </ul>

        <p class="d-flex justify-content-between fw-bold fs-5 mb-0">
          <span>Total</span>
          <span>{{ total() }}$</span>
        </p>
      }
    </div>
  </div>
</section>
